<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" width="100%" height="100%">
  <defs>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="740" height="240" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="370" y="30" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">为什么屏幕直接线性插值会失真？—— 3D 铁轨等距枕木 vs 2D 屏幕近宽远窄</text>

  <!-- 上排：3D 世界真实铁轨 (严格等分 6 段，总长 600: x from 70 to 670, 每段 100) -->
  <text x="70" y="62" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#0284c7">1. 3D 真实空间铁轨（每根枕木严格等距 1 米，中点在 50% 处）：</text>
  <rect x="70" y="72" width="600" height="28" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <line x1="170" y1="72" x2="170" y2="100" stroke="#0284c7" stroke-width="2"/>
  <line x1="270" y1="72" x2="270" y2="100" stroke="#0284c7" stroke-width="2"/>
  <line x1="370" y1="70" x2="370" y2="102" stroke="#dc2626" stroke-width="4"/>
  <line x1="470" y1="72" x2="470" y2="100" stroke="#0284c7" stroke-width="2"/>
  <line x1="570" y1="72" x2="570" y2="100" stroke="#0284c7" stroke-width="2"/>

  <text x="70" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">0m (近端)</text>
  <text x="370" y="118" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">★ 3D 正中间枕木 (3m / 50%)</text>
  <text x="670" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">6m (远端)</text>

  <!-- 对应连线：3D 中点 (370, 122) 投影到 2D 屏幕跑到了 (520, 158) -->
  <line x1="370" y1="124" x2="515" y2="160" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-p)"/>

  <!-- 下排：2D 屏幕照片 (近大远小，间距递减: +200, +135, +90, +65, +50, +35, +25) -->
  <text x="70" y="155" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#d97706">2. 拍到 2D 屏幕照片上（近大远小：近处占像素极宽，远处被挤压在末尾）：</text>
  <rect x="70" y="165" width="600" height="28" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <!-- 刻度: 70, 270(+200), 415(+145), 520(+105 -> 这是第3根!), 590(+70), 638(+48), 670(+32) -->
  <line x1="270" y1="165" x2="270" y2="193" stroke="#d97706" stroke-width="2"/>
  <line x1="415" y1="165" x2="415" y2="193" stroke="#d97706" stroke-width="2"/>
  <line x1="520" y1="163" x2="520" y2="195" stroke="#dc2626" stroke-width="4"/>
  <line x1="590" y1="165" x2="590" y2="193" stroke="#d97706" stroke-width="2"/>
  <line x1="638" y1="165" x2="638" y2="193" stroke="#d97706" stroke-width="2"/>

  <!-- 屏幕几何中点 x=370 -->
  <line x1="370" y1="165" x2="370" y2="193" stroke="#64748b" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="340" y="215" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#64748b">▲ 屏幕像素 50% 处(实际才到 1.6m)</text>
  <text x="545" y="215" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">★ 3D 中点枕木跑到了屏幕 75% 处！</text>
</svg>
