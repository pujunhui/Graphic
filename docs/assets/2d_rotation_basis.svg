<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="600" height="340" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="300" y="30" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">二维旋转矩阵推导：基向量 i(1,0) 与 j(0,1) 逆时针旋转 θ</text>

  <!-- 单位圆与网格 -->
  <circle cx="280" cy="240" r="150" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- 坐标轴 -->
  <line x1="80" y1="240" x2="500" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <line x1="280" y1="310" x2="280" y2="55" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="510" y="245" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#475569">X</text>
  <text x="280" y="45" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#475569">Y</text>
  <text x="265" y="258" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">O(0,0)</text>

  <!-- 原基向量 i(1,0) 与旋转后 i'(cosθ, sinθ) -->
  <line x1="280" y1="240" x2="430" y2="240" stroke="#0284c7" stroke-width="3" stroke-opacity="0.4" marker-end="url(#arrow-blue)"/>
  <text x="435" y="260" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#0284c7">i (1, 0)</text>

  <!-- θ = 35度: cos35=0.819 (dx=123), sin35=0.574 (dy=-86) -> (403, 154) -->
  <line x1="280" y1="240" x2="403" y2="154" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="403" y1="154" x2="403" y2="240" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="412" y="150" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#0284c7">i' (cosθ, sinθ) → 矩阵第1列</text>

  <!-- 角度弧线1 -->
  <path d="M 330 240 A 50 50 0 0 0 321 211" fill="none" stroke="#0284c7" stroke-width="1.8"/>
  <text x="338" y="225" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#0284c7">θ</text>

  <!-- 原基向量 j(0,1) 与旋转后 j'(-sinθ, cosθ) -->
  <line x1="280" y1="240" x2="280" y2="90" stroke="#16a34a" stroke-width="3" stroke-opacity="0.4" marker-end="url(#arrow-green)"/>
  <text x="290" y="95" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">j (0, 1)</text>

  <!-- j' : dx=-86, dy=-123 -> (194, 117) -->
  <line x1="280" y1="240" x2="194" y2="117" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="194" y1="117" x2="280" y2="117" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="45" y="112" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">j' (-sinθ, cosθ) → 矩阵第2列</text>

  <!-- 角度弧线2 -->
  <path d="M 280 190 A 50 50 0 0 0 251 199" fill="none" stroke="#16a34a" stroke-width="1.8"/>
  <text x="258" y="182" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">θ</text>
</svg>
