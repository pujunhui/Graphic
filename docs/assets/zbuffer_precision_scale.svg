<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 220" width="100%" height="100%">
  <rect width="740" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="370" y="30" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Z-Buffer 非线性深度精度分布尺（以近平面 n = 0.1m，远平面 f = 100m 为例）</text>

  <!-- 进度尺总长 600px (x: 70 -> 670) 代表 Z-Buffer [0.00 -> 1.00] -->
  <!-- 区间1: 0.1m ~ 1.0m -> Z-Buffer [0.00 ~ 0.09] -> 54px (70 ~ 124) -->
  <rect x="70" y="75" width="54" height="55" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <!-- 区间2: 1.0m ~ 10.0m -> Z-Buffer [0.09 ~ 0.59] -> 300px (124 ~ 424) -->
  <rect x="124" y="75" width="300" height="55" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <!-- 区间3: 10.0m ~ 100.0m -> Z-Buffer [0.59 ~ 1.00] -> 246px (424 ~ 670) -->
  <rect x="424" y="75" width="246" height="55" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>

  <!-- 顶部真实距离刻度 -->
  <text x="70" y="64" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#15803d">0.1m (近)</text>
  <text x="124" y="64" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#15803d">1.0m</text>
  <text x="424" y="64" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">10.0m (仅总距离的10%)</text>
  <text x="670" y="64" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">100.0m (远)</text>

  <!-- 条内文字 -->
  <text x="97" y="107" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#15803d">9%</text>
  <text x="274" y="100" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#15803d">前 10 米抢走了 59% 的浮点数精度！</text>
  <text x="274" y="118" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#166534">（近处精度极高，绝不闪烁）</text>

  <text x="547" y="100" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">后 90 米只能挤在剩下的 41% 里！</text>
  <text x="547" y="118" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#991b1b">（远处精度极差，极易发生 Z-Fighting 闪烁）</text>

  <!-- 底部 Z-Buffer 数值刻度 -->
  <text x="70" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#334155">Z = 0.00</text>
  <text x="124" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#334155">Z = 0.09</text>
  <text x="424" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#334155">Z = 0.59</text>
  <text x="670" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#334155">Z = 1.00</text>

  <text x="370" y="192" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">工程铁律：适当调大近平面 n（如从 0.01 调到 0.1~0.5），可大幅改善远景 Z-Fighting 深度冲突</text>
</svg>
