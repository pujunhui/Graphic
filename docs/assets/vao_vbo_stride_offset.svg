<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="100%" height="100%">
  <defs>
    <marker id="arr-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect width="760" height="250" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="380" y="30" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">交叉式 VBO (Interleaved VBO) 内存字节刻度尺：一眼看懂 Stride 与 Offset</text>

  <!-- 顶部 Stride 跨度标注: x from 50 to 530 (总宽 480 代表 32 字节, 每字节 15px) -->
  <line x1="50" y1="52" x2="50" y2="85" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="530" y1="52" x2="530" y2="85" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="55" y1="62" x2="525" y2="62" stroke="#1e293b" stroke-width="2" marker-start="url(#arr-dim)" marker-end="url(#arr-dim)"/>
  <rect x="180" y="48" width="220" height="24" fill="#f8fafc"/>
  <text x="290" y="65" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">1 个顶点总步长 Stride = 32 字节</text>

  <!-- 顶点 0 的三个属性块 -->
  <!-- 1. Position: 12 字节 -> 180px (50 ~ 230) -->
  <rect x="50" y="90" width="180" height="65" fill="#dbeafe" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="118" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#0369a1">属性0: 位置 Position</text>
  <text x="140" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#0284c7">3 × float = 12 字节</text>

  <!-- 2. Normal: 12 字节 -> 180px (230 ~ 410) -->
  <rect x="230" y="90" width="180" height="65" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="118" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#15803d">属性1: 法线 Normal</text>
  <text x="320" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#16a34a">3 × float = 12 字节</text>

  <!-- 3. UV: 8 字节 -> 120px (410 ~ 530) -->
  <rect x="410" y="90" width="120" height="65" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="470" y="118" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#b45309">属性2: UV</text>
  <text x="470" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#d97706">2 × float = 8 字节</text>

  <!-- 下一个顶点示意 (530 ~ 710) -->
  <rect x="530" y="90" width="180" height="65" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="620" y="128" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#64748b">下一个顶点 (Vertex 1)...</text>

  <!-- 底部 Offset 刻度指针 -->
  <text x="50" y="182" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#0284c7">▲ Offset = 0</text>
  <text x="50" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">(第 0 字节)</text>

  <text x="230" y="182" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">▲ Offset = 12</text>
  <text x="230" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">(3 * sizeof(float))</text>

  <text x="410" y="182" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#d97706">▲ Offset = 24</text>
  <text x="410" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">(6 * sizeof(float))</text>

  <text x="530" y="182" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#475569">▲ 字节 32</text>
  <text x="530" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">(Vertex 1 起点)</text>

  <text x="380" y="232" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#334155">寻址公式：第 index 号顶点的属性地址 = Stride(32) × index + Offset</text>
</svg>
