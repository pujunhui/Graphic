<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="100%" height="100%">
  <rect width="620" height="320" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="310" y="32" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Bresenham 直线算法：候选像素中心到理想直线的垂直距离 d₁ 与 d₂</text>

  <!-- 网格线 -->
  <line x1="120" y1="70" x2="120" y2="270" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="340" y1="70" x2="340" y2="270" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="100" x2="520" y2="100" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="80" y1="230" x2="520" y2="230" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 坐标轴标签 -->
  <text x="120" y="292" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#334155">xᵢ (当前列)</text>
  <text x="340" y="292" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#334155">xᵢ + 1 (下一列)</text>
  <text x="65" y="235" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#334155">yᵢ</text>
  <text x="65" y="105" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#334155">yᵢ + 1</text>

  <!-- 理想连续直线: 经过 (120, 230) 到 (340, 145) 延伸到 (480, 91) -->
  <line x1="80" y1="245" x2="500" y2="83" stroke="#f59e0b" stroke-width="3"/>
  <text x="495" y="75" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#d97706">理想连续直线 y_real = k·x + b</text>

  <!-- d1 和 d2 距离标注线 -->
  <!-- 上候选点 (340, 100) 到 交点 (340, 145) 为 d2 -->
  <line x1="340" y1="100" x2="340" y2="145" stroke="#dc2626" stroke-width="2.5"/>
  <text x="352" y="128" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">d₂ = (yᵢ + 1) - y_real （更近！）</text>

  <!-- 交点 (340, 145) 到 下候选点 (340, 230) 为 d1 -->
  <line x1="340" y1="145" x2="340" y2="230" stroke="#0284c7" stroke-width="2.5"/>
  <text x="352" y="195" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#0284c7">d₁ = y_real - yᵢ</text>

  <!-- 已点亮像素 (xi, yi) -->
  <circle cx="120" cy="230" r="10" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <text x="120" y="255" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#15803d">当前像素 (xᵢ, yᵢ)</text>

  <!-- 理想交点 (340, 145) -->
  <circle cx="340" cy="145" r="5" fill="#f59e0b"/>

  <!-- 上候选像素 (xi+1, yi+1) -->
  <circle cx="340" cy="100" r="10" fill="#dc2626" stroke="#fff" stroke-width="2"/>
  <text x="340" y="82" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">上方候选像素 (xᵢ+1, yᵢ+1)</text>

  <!-- 下候选像素 (xi+1, yi) -->
  <circle cx="340" cy="230" r="10" fill="#0284c7" stroke="#fff" stroke-width="2"/>
  <text x="340" y="255" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">当前行候选像素 (xᵢ+1, yᵢ)</text>
</svg>
