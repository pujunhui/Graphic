<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="100%" height="100%">
  <defs>
    <marker id="arr-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-l" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arr-ray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="600" height="260" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="300" y="30" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Lambert 漫反射余弦定律：表面法向量 n 与指向光源向量 l</text>

  <!-- 物体表面横线 y=200 -->
  <line x1="90" y1="200" x2="510" y2="200" stroke="#334155" stroke-width="4"/>
  <rect x="90" y="200" width="420" height="18" fill="#cbd5e1"/>
  <circle cx="280" cy="200" r="6" fill="#1e293b"/>
  <text x="280" y="238" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">物体表面着色点 P</text>

  <!-- 法向量 n: 从 (280, 200) 垂直向上到 (280, 65) -->
  <line x1="280" y1="200" x2="280" y2="65" stroke="#0284c7" stroke-width="3.5" marker-end="url(#arr-n)"/>
  <text x="270" y="60" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#0284c7">单位法向量 n (垂直表面朝外)</text>

  <!-- 光源太阳图标在 (410, 70) -->
  <circle cx="425" cy="65" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="70" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#b45309">光源</text>

  <!-- 指向光源的向量 l: 从 P(280, 200) 指向 (405, 78) -->
  <line x1="280" y1="200" x2="405" y2="80" stroke="#d97706" stroke-width="3.5" marker-end="url(#arr-l)"/>
  <text x="395" y="135" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#d97706">指向光源向量 l = -normalize(lightDir)</text>

  <!-- 真实光线行进方向 (虚线反方向): 从 (385, 70) 到 (270, 182) -->
  <line x1="382" y1="72" x2="275" y2="177" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-ray)"/>
  <text x="235" y="130" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#64748b">物理光线传播方向 (lightDir)</text>

  <!-- 夹角 θ 弧线 -->
  <path d="M 280 140 A 60 60 0 0 1 323 158" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="305" y="132" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">θ</text>
  <text x="430" y="175" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">漫反射光强 = max(n · l, 0) = max(cosθ, 0)</text>
</svg>
